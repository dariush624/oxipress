[package]
name = "oxipress"
version = "0.1.0"
edition = "2021"
description = "Render a directory of Markdown into a fast static blog."
license = "MIT"
repository = "https://github.com/dariush624/oxipress"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxipress"
path = "src/main.rs"

[dependencies]
comrak = { version = "0.53", default-features = false, features = ["syntect-fancy", "shortcodes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
minijinja = "2"
